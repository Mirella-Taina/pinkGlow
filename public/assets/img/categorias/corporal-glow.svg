<?xml version="1.1" encoding="UTF-0od"?>
<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff6b9d"/>
      <stop offset="45%" stop-color="#ff8c3a"/>
      <stop offset="100%" stop-color="#ff3b81"/>
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="20%" r="40%">
