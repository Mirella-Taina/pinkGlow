# =====================================================================
# Pink Glow — configuração nginx (app em /pinkglow/public/)
# ---------------------------------------------------------------------
# Premissas:
#   - Projeto em /var/www/html/pinkglow (pasta própria, NÃO na raiz)
#   - App servida em http://seu-servidor/pinkglow/public/  (APP_BASE=/pinkglow/public)
#   - Raiz do servidor "/" e raiz do projeto "/pinkglow/" redirecionam
#     para /pinkglow/public/
#   - PHP-FPM no socket indicado (ajuste para seu servidor)
#   - Variáveis de ambiente no pool FPM (ver deploy/README.md):
#     PGHOST, PGUSER, PGPASSWORD, PGDATABASE, APP_BASE=/pinkglow/public
# =====================================================================

server {
    listen 80;
    server_name _;  # ⚠️ PRODUÇÃO: coloque seu domínio real aqui

    root /var/www/html;  # webroot do servidor

    # --- Raiz do servidor → aplicação ---
    location = / {
        return 301 /pinkglow/public/;
    }

    # --- Raiz do projeto → pasta public (redirecionamento pedido) ---
    location = /pinkglow {
        return 301 /pinkglow/public/;
    }
    location = /pinkglow/ {
        return 301 /pinkglow/public/;
    }

    # --- Bloqueio de arquivos sensíveis ---
    location ~ ^/pinkglow/(config|migrations|scripts|\.opencode)/ { deny all; return 404; }
    location ~ /\. { deny all; return 404; }

    # --- Arquivos estáticos (css, js, img, fonts) ---
    location ~ ^/pinkglow/public/(.+\.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$) {
        alias /var/www/html/pinkglow/public/$1;
        expires 7d;
        add_header Cache-Control "public";
    }

    # --- Scripts PHP ---
    location ~ ^/pinkglow/public/(.+\.php)$ {
        alias /var/www/html/pinkglow/public/$1;
        fastcgi_pass unix:/run/php/php-fpm.sock;  # ⚠️ AJUSTE SEU SOCKET
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $request_filename;
        fastcgi_param DOCUMENT_ROOT /var/www/html/pinkglow/public;
        fastcgi_param REQUEST_URI $request_uri;  # inclui /pinkglow/public/ — APP_BASE normaliza
    }

    # --- Demais rotas da aplicação (front controller) ---
    location /pinkglow/public/ {
        alias /var/www/html/pinkglow/public/;
        index index.php index.html;
        try_files $uri $uri/ /pinkglow/public/index.php?$query_string;
    }
}